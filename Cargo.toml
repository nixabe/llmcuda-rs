[workspace]
resolver = "3"
members = [
    "crates/llmcuda-gguf",
    "crates/llmcuda-model",
    "crates/llmcuda-cache",
    "crates/llmcuda-sched",
    "crates/llmcuda-kernels",
    "crates/llmcuda-log",
    "crates/llmcuda-cuda",
    "crates/llmcuda-grammar",
    "crates/llmcuda-engine",
    "crates/llmcuda-server",
    "crates/llmcuda-mcp",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nixabe/llmcuda-rs"
authors = ["llmcuda-rs contributors"]

[workspace.dependencies]
llmcuda-mcp = { path = "crates/llmcuda-mcp" }
llmcuda-gguf = { path = "crates/llmcuda-gguf" }
llmcuda-model = { path = "crates/llmcuda-model" }
llmcuda-cache = { path = "crates/llmcuda-cache" }
llmcuda-sched = { path = "crates/llmcuda-sched" }
llmcuda-kernels = { path = "crates/llmcuda-kernels" }
llmcuda-log = { path = "crates/llmcuda-log" }
llmcuda-cuda = { path = "crates/llmcuda-cuda" }
llmcuda-grammar = { path = "crates/llmcuda-grammar" }
llmcuda-engine = { path = "crates/llmcuda-engine" }

clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
memmap2 = "0.9"
half = "2"
rustc-hash = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# Kernel-correctness work is unusably slow in a plain debug build; the
# differential harness (docs/TESTING.md) runs thousands of reference ops.
[profile.dev.package."*"]
opt-level = 2
