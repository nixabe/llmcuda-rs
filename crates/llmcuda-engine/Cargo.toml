[package]
name = "llmcuda-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The optional TensorRT backend and its benches; off by default. See
# crates/llmcuda-trt for what it needs at build and run time.
tensorrt = ["dep:llmcuda-trt", "llmcuda-trt/tensorrt"]

[dependencies]
tracing.workspace = true
llmcuda-log.workspace = true
llmcuda-model.workspace = true
llmcuda-gguf.workspace = true
llmcuda-cuda.workspace = true
cudarc = { version = "0.19.9", features = ["driver", "nvrtc", "fallback-dynamic-loading", "cuda-12040"] }
llmcuda-cache.workspace = true
llmcuda-sched.workspace = true
llmcuda-kernels.workspace = true
llmcuda-grammar.workspace = true
llmcuda-trt = { workspace = true, optional = true }
parking_lot.workspace = true
rustc-hash.workspace = true
half.workspace = true
smallvec = "1"

[dev-dependencies]
tokenizers = "0.22"

[[bin]]
name = "bench_trt_gemm"
required-features = ["tensorrt"]
