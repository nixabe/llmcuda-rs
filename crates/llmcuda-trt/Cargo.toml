[package]
name = "llmcuda-trt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = []
# Off by default: CI has no TensorRT and no GPU. With the feature off this
# crate is an empty stub and `build.rs` compiles nothing. With it on, set
# `TENSORRT_ROOT` (headers in `include/`, libraries in `lib/`) and a CUDA
# toolkit root for `cuda_runtime_api.h`; see docs/TOOLCHAIN.md.
tensorrt = [
    "dep:cudarc",
    "dep:thiserror",
    "dep:tracing",
    "dep:llmcuda-log",
    "dep:llmcuda-cuda",
    "dep:llmcuda-kernels",
    "dep:half",
]

[dependencies]
tracing = { workspace = true, optional = true }
llmcuda-log = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
cudarc = { version = "0.19.9", optional = true, features = ["driver", "nvrtc", "fallback-dynamic-loading", "cuda-12040"] }
llmcuda-cuda = { workspace = true, optional = true }
# Only `trt_probe` uses these (CPU references, fp16 test data); the library
# itself never does.
llmcuda-kernels = { workspace = true, optional = true }
half = { workspace = true, optional = true }

[build-dependencies]
cc = "1.4"

[[bin]]
name = "trt_probe"
path = "src/bin/trt_probe/main.rs"
required-features = ["tensorrt"]
